<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f0f10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>手写 Live · MVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;600;700;900&family=ZCOOL+XiaoWei&family=Long+Cang&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">手写 Live</div>
      <div class="steps" id="step-dots" aria-label="进度">
        <span class="dot active" data-step="0">1</span>
        <span class="dot" data-step="1">2</span>
        <span class="dot" data-step="2">3</span>
        <span class="dot" data-step="3">4</span>
      </div>
    </header>

    <div class="step-meta">
      <p class="step-title" id="step-title">第 1 步 · 选照片</p>
      <p class="step-hint" id="step-hint">用作成片最底层。可跳过，用纯色底。</p>
    </div>

    <div id="stage-wrap">
      <canvas id="main"></canvas>
      <button type="button" class="canvas-reset hidden" id="btn-reset-view" title="复位视图（双指捏合 / 滚轮缩放）">复位</button>
    </div>

    <!-- 第 1 步面板 -->
    <div class="sheet" id="panel-0">
      <label class="big-btn primary">
        <input type="file" accept="image/*" id="input-photo" hidden />
        从相册选照片
      </label>
      <button type="button" class="big-btn ghost" id="btn-skip-photo">跳过，用白底</button>
    </div>

    <!-- 第 2 步：Poster 模板 + 摆红框 -->
    <div class="sheet sheet-tpl hidden" id="panel-1">
      <div class="tpl-panel-top">
        <div class="tpl-cat-row" role="tablist" aria-label="模板分类">
          <button type="button" class="tpl-cat-btn active" data-cat="all">全部</button>
          <button type="button" class="tpl-cat-btn" data-cat="square">方形</button>
          <button type="button" class="tpl-cat-btn" data-cat="vertical">竖排</button>
          <button type="button" class="tpl-cat-btn" data-cat="horizontal">横排</button>
          <button type="button" class="tpl-cat-btn" data-cat="custom">自定义</button>
        </div>
        <div class="tpl-list-wrap">
          <div class="tpl-list" id="tpl-list" role="listbox" aria-label="海报模板"></div>
        </div>
      </div>
      <p class="inline-tip" id="panel-1-tip">左右滑动选模板 · 拖红框移动 · 双指缩放</p>
      <div class="custom-editor hidden" id="custom-editor">
        <div class="custom-row-1">
          <button type="button" class="pill-btn small" id="btn-custom-add" title="点选后，在红框内轻点落点">＋圆位</button>
          <span class="custom-place-hint hidden" id="custom-place-hint">在红框内点击放置</span>
        </div>
        <label class="custom-labels-wrap"
          >槽位数字（圈内显示）
          <input
            type="text"
            class="custom-labels-in"
            id="custom-labels"
            inputmode="numeric"
            autocomplete="off"
            placeholder="连写如 1234，按圆顺序"
          />
        </label>
        <div class="custom-chips" id="custom-slot-list"></div>
      </div>
    </div>

    <!-- 第 3 步：一字一格 + 田字格（参考字位置大小须在本步完成） -->
    <div class="sheet sheet-step2 hidden" id="panel-2">
      <div class="seg" role="tablist" aria-label="画布上怎么操作">
        <button type="button" class="seg-btn active" id="btn-step2-poster" data-step2-mode="poster">
          移动整张海报
        </button>
        <button type="button" class="seg-btn" id="btn-step2-slot" data-step2-mode="slot">调参考字</button>
      </div>
      <p class="caption" id="step2-coach"></p>
      <div class="slot-row" id="slot-row"></div>
      <div class="char-row">
        <input type="text" class="char-in" id="warp-char" maxlength="1" placeholder="一字" autocomplete="off" />
        <button type="button" class="pill-btn primary" id="btn-open-warp">田字格微调</button>
      </div>
    </div>

    <!-- 第 4 步：写字 -->
    <div class="sheet sheet-draw hidden" id="panel-3">
      <div class="draw-row-brush">
        <button type="button" class="pill-btn brush-current" id="btn-open-brush-modal" title="选择笔刷与参数">
          <span class="brush-current-icon" id="brush-current-icon">✒</span>
          <span class="brush-current-label" id="brush-current-label">顺滑</span>
          <span class="brush-current-caret">▾</span>
        </button>
        <label class="ico-color" title="颜色">
          <input type="color" id="brush-color" value="#1a1a1a" />
        </label>
        <input type="range" id="brush-size" class="size-slider" min="1" max="22" value="4" title="粗细" />
      </div>
      <div class="draw-row-replay">
        <label class="replay-label" title="导出回放顺序">回放
          <select id="replay-mode" class="mini-select">
            <option value="stroke">按笔画</option>
            <option value="char">按字（槽位）</option>
            <option value="char-sync">按字（全体同步）</option>
            <option value="silent">不写直出（按字蹦出）</option>
            <option value="silent-sync">不写直出（全体压扁弹入）</option>
          </select>
        </label>
        <label class="replay-label" title="出场动画风格">动画
          <select id="replay-fx" class="mini-select">
            <option value="dash">描线</option>
            <option value="drop">掉落</option>
            <option value="shake">抖动</option>
            <option value="squash">压扁弹入</option>
            <option value="erase">擦入</option>
          </select>
        </label>
      </div>
      <div class="draw-actions">
        <button type="button" class="pill-btn" id="btn-trace-big" title="全屏照着写；笔迹自动归到对应红圈">大字描写</button>
        <button type="button" class="pill-btn" id="btn-preview-play" title="按当前回放顺序预览，不导出">预览</button>
        <button type="button" class="pill-btn" id="btn-ref" title="显示或隐藏海报红框参考层">
          参考 <span id="ref-label">开</span>
        </button>
        <button type="button" class="pill-btn" id="btn-path-edit" title="点选笔画，再用上方颜色/粗细/效果/笔刷调整">编辑</button>
        <button type="button" class="pill-btn" id="btn-undo" title="撤回上一笔">撤回</button>
      </div>
      <!-- 仅「笔画」模式下出现：选中笔画即时改效果 -->
      <div class="effect-row hidden" id="effect-row" aria-label="选中笔画效果">
        <button type="button" class="pill-btn effect-btn active" data-effect="none">普通</button>
        <button type="button" class="pill-btn effect-btn" data-effect="neon">发光</button>
        <button type="button" class="pill-btn effect-btn" data-effect="emboss">立体</button>
        <button type="button" class="pill-btn effect-btn" data-effect="knockout">镂空</button>
        <button type="button" class="pill-btn warn" id="btn-delete-stroke" title="删除选中笔画">删</button>
      </div>
    </div>

    <!-- 大字逐字描写（与主画布同坐标系，便于合并） -->
    <div id="trace-modal" class="modal modal-trace hidden" aria-hidden="true">
      <div class="trace-inner">
        <div class="trace-head">
          <span id="trace-title">大字描写</span>
          <button type="button" class="icon-btn" id="trace-close" aria-label="关闭">✕</button>
        </div>
        <p class="trace-sub" id="trace-sub">
          淡印为第 3 步已摆好的参考字（若不满意请退回第 3 步用「调参考字」改）。写完后点「本字完成」。
        </p>
        <div class="trace-stage-wrap" id="trace-stage-wrap">
          <canvas id="trace-canvas"></canvas>
        </div>
        <div class="trace-foot">
          <button type="button" class="nav-btn" id="trace-prev">上一字</button>
          <button type="button" class="nav-btn primary" id="trace-done-slot">本字完成</button>
          <button type="button" class="nav-btn" id="trace-next">下一字</button>
        </div>
        <button type="button" class="big-btn ghost full" id="trace-exit-all">收工回主画布</button>
      </div>
    </div>

    <!-- 底栏 -->
    <footer class="bottom-bar">
      <button type="button" class="nav-btn" id="btn-back">上一步</button>
      <button type="button" class="nav-btn primary" id="btn-next">下一步</button>
    </footer>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <!-- 田字格全屏 -->
  <div id="warp-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-inner">
      <div class="modal-head">
        <span>田字格字形</span>
        <button type="button" class="icon-btn" id="warp-close" aria-label="关闭">✕</button>
      </div>
      <label class="warp-font-row"
        >字体
        <select id="warp-font" class="modal-select">
          <option value="'Noto Serif SC', 'Songti SC', 'STSong', serif">思源宋体</option>
          <option value="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">思源黑体</option>
          <option value="'ZCOOL XiaoWei', 'KaiTi', 'STKaiti', serif">站酷小薇（楷意）</option>
          <option value="'Long Cang', cursive">仓耳龙藏（手写）</option>
          <option value="'Ma Shan Zheng', 'KaiTi', serif">马善政楷书</option>
          <option value="'Zhi Mang Xing', cursive">芝茫行（行书）</option>
          <option value="'Liu Jian Mao Cao', cursive">刘健毛草（草书）</option>
          <option value="'沐瑶随心手写体', cursive">沐瑶随心手写体（本地）</option>
          <option value="'Chillzhuo', '寒蝉手拙体', cursive">寒蝉手拙体（本地）</option>
          <option value="'PingFang SC', 'STHeiti', 'Microsoft YaHei', sans-serif">系统黑体</option>
        </select>
      </label>
      <p class="warp-hintline">粉点拖外框 · 蓝线/蓝点拖田字比例；双击角或轴可复位。</p>
      <div class="warp-stage" id="warp-stage" touch-action="none">
        <canvas id="warp-out" width="512" height="512" aria-label="字形预览"></canvas>
        <svg id="warp-overlay" class="warp-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <polygon class="warp-frame-line" id="warp-frame-poly" points="0,0 1000,0 1000,1000 0,1000" />
          <line class="warp-axis-hitarea" id="warp-axis-v-hit" x1="500" y1="0" x2="500" y2="1000" />
          <line class="warp-axis-hitarea" id="warp-axis-h-hit" x1="0" y1="500" x2="1000" y2="500" />
          <line class="warp-axis-line" id="warp-axis-v" x1="500" y1="0" x2="500" y2="1000" />
          <line class="warp-axis-line" id="warp-axis-h" x1="0" y1="500" x2="1000" y2="500" />
          <circle class="warp-axis-handle" id="warp-axis-vx-handle" r="7" cx="500" cy="500" />
          <circle class="warp-axis-handle" id="warp-axis-hy-handle" r="7" cx="500" cy="500" />
          <circle class="warp-corner-handle" id="warp-corner-tl" r="10" cx="20" cy="20" data-corner="tl" />
          <circle class="warp-corner-handle" id="warp-corner-tr" r="10" cx="980" cy="20" data-corner="tr" />
          <circle class="warp-corner-handle" id="warp-corner-bl" r="10" cx="20" cy="980" data-corner="bl" />
          <circle class="warp-corner-handle" id="warp-corner-br" r="10" cx="980" cy="980" data-corner="br" />
        </svg>
      </div>
      <div class="warp-sliders">
        <label>竖轴（左右挤，可与蓝线同调）<input type="range" id="warp-vx" min="8" max="92" value="50" /></label>
        <label>横轴（上下挤，可与蓝线同调）<input type="range" id="warp-hy" min="8" max="92" value="50" /></label>
      </div>
      <div class="warp-presets">
        <button type="button" data-p="rf">右肥</button>
        <button type="button" data-p="us">上挤</button>
        <button type="button" data-p="trap">倒梯形</button>
        <button type="button" data-p="reset">重置</button>
      </div>
      <button type="button" class="big-btn primary full" id="warp-ok">用到红圈</button>
    </div>
  </div>

  <!-- 笔刷选择 + 参数抽屉 -->
  <div id="brush-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-inner brush-modal-inner">
      <div class="modal-head">
        <span>笔刷</span>
        <button type="button" class="icon-btn" id="brush-modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="brush-grid" id="brush-grid" role="listbox" aria-label="选择笔刷"></div>
      <div class="brush-params" id="brush-params" aria-label="笔刷参数"></div>
      <button type="button" class="big-btn primary full" id="brush-modal-ok">用这个笔刷</button>
    </div>
  </div>

  <!-- 导出中 -->
  <div id="export-mask" class="mask hidden">
    <div class="spinner"></div>
    <p>正在合成视频…</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
