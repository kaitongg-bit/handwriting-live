# 发布方式：把构建结果推到 gh-pages 分支（不走 deploy-pages，避免 Actions 里长时间卡在 updating_pages）
#
# 仓库 Settings → Pages → Build and deployment：
#   Source 选 「Deploy from a branch」（不要选 GitHub Actions）
#   Branch 选 gh-pages，Folder 选 / (root)
# 首次成功运行后才会出现 gh-pages 分支，再在 Pages 里选该分支
#
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mvp/package-lock.json

      - name: Install & build
        working-directory: mvp
        run: |
          npm ci
          npm run build

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mvp/dist
          force_orphan: true
